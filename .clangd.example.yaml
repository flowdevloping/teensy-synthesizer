# Specify extra compiler options for clangd 
CompileFlags:
  Add:
    - --target=arm-none-eabi # Specifies the target platform/architecture to compile to
    # Path to stdlib.h:
    - -isystem # Adds a system include directory
    - C:/Users/<USERNAME>/AppData/Local/Arduino15/packages/teensy/tools/teensy-compile/15.2.1/arm/arm-none-eabi/include # Specifies the concrete path 
    # Path to type_traits:
    - -isystem
    - C:/Users/<USERNAME>/AppData/Local/Arduino15/packages/teensy/tools/teensy-compile/15.2.1/arm/arm-none-eabi/include/c++/15.2.1
    # Path to bits/c++config.h:
    - -isystem
    - C:/Users/<USERNAME>/AppData/Local/Arduino15/packages/teensy/tools/teensy-compile/15.2.1/arm/arm-none-eabi/include/c++/15.2.1/arm-none-eabi/

# Suppress strict type check regarding GCC-Headers
Diagnostics: # Specifies diagnostic settings
  Suppress: # Suppresses specific warnings
    - ovl_diff_return_type # Suppresses this specific warning